<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../styles/template.css">
    <title>Pic</title>
</head>
<body>
    <header class="header">
        <div class="header-content container">
            <a class="logo" href="../../index.html">
                <span class="logo-text">Gym<span>Pro</span></span>
            </a>
            <nav class="nav">
                <a href="" class="nav__link">задание 1</a>
                <a href="../task2/index.html" class="nav__link">задание 2</a>
                <a href="#" class="nav__link">задание 3</a>
                <a href="#" class="nav__link">задание 4</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="picture__section container">
            <div class="picture">
                <div class="picture__border">
                    <div class="picture__cloud__top"></div>
                    <div class="picture__cloud__bottom"></div>
                    
                    <div class="picture__dragonfly">
                        <div class="picture__dragonfly__body"></div>
                        <div class="picture__dragonfly__header">
                            <div class="picture__dragonfly__header__eye picture__dragonfly__header__eye--left"></div>
                            <div class="picture__dragonfly__header__eye picture__dragonfly__header__eye--right"></div>
                        </div>
                        <div class="picture__dragonfly__stole picture__dragonfly__stole--top--left"></div>
                        <div class="picture__dragonfly__stole picture__dragonfly__stole--bottom--left"></div>
                        <div class="picture__dragonfly__stole picture__dragonfly__stole--top--right"></div>
                        <div class="picture__dragonfly__stole picture__dragonfly__stole--bottom--right"></div>
                    </div>

                    <div class="picture__mushroom picture__mushroom--big">
                        <div class="picture__mushroom__cap picture__mushroom__cap--big"></div>
                        <div class="picture__mushroom__stulk picture__mushroom__stulk--big"></div>
                    </div>

                    <div class="picture__mushroom picture__mushroom--small">
                        <div class="picture__mushroom__cap picture__mushroom__cap--small"></div>
                        <div class="picture__mushroom__stulk picture__mushroom__stulk--small"></div>
                    </div>

                    <ul class="picture__bottom__triangles">
                        <li class="picture__bottom__triangles__triangle"></li>
                        <li class="picture__bottom__triangles__triangle"></li>
                        <li class="picture__bottom__triangles__triangle"></li>
                        <li class="picture__bottom__triangles__triangle"></li>
                    </ul>
                </div>
            </div>

            <div class="example"></div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer__content container">
            <div class="logo">
                <span class="logo-text">Gym<span>Pro</span></span>
            </div>
            <nav class="nav">
                <a href="" class="nav__link">задание 1</a>
                <a href="../task2/index.html" class="nav__link">задание 2</a>
                <a href="#" class="nav__link">задание 3</a>
                <a href="#" class="nav__link">задание 4</a>
            </nav>
            <div class="footer__contacts">
                <div class="footer__contacts__mail">zalomov.ie@edu.spbstu.ru</div>
                <ul class="footer__contacts__socials">
                    <li><img src="../../images/inst.png" alt="inst"></li>
                    <li><img src="../../images/git.png" alt="git"></li>
                    <li><img src="../../images//vk.png" alt="vk"></li>
                </ul>
            </div>
        </div>
    </footer>

</body>
</html>
